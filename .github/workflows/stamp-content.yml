# When the admin publishes events or posts (content/*.json), re-stamp the
# static HTML copies so crawlers see the new dates, then push. Vercel redeploys.
name: Stamp content
on:
  push:
    branches: [main]
    paths: ['content/**']
permissions:
  contents: write
jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/stamp-content.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet; then echo "already up to date"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add events.html blog/index.html
          git commit -m "stamp: refresh static events/blog lists from content"
          git push
